[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-agent"
version = "0.1.0"
description = "Multi-model agent orchestration built on LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "pydantic>=2.7.0"
]

[project.optional-dependencies]
jev = ["langchain-typesafe"]
openai = ["langchain-openai>=0.2.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hybrid_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
